<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">SPY 2026-09-10 minute line</title><desc id="d">A thin line joins the session open and every observed minute close, 09:30 to 16:00 ET. No trade outcome is drawn on this line. Coloring a span needs all three of an entry time, an exit time, and a settled outcome from the broker record; where any one is missing, or where two sources disagree about the same trade, the span stays neutral. Neutral never means no trades occurred.</desc><path d="M24.00,196.20 L26.44,201.11 L28.88,206.00 L31.32,209.56 L33.76,198.88 L36.21,220.25 L38.65,197.51 L41.09,171.27 L43.53,190.86 L45.97,176.62 L48.41,160.59 L50.85,157.92 L53.29,157.83 L55.73,166.82 L58.17,153.46 L60.62,186.41 L63.06,156.14 L65.50,130.31 L67.94,133.88 L70.38,159.70 L72.82,141.44 L75.26,196.14 L77.70,249.63 L80.14,238.95 L82.58,244.29 L85.03,259.42 L87.47,285.25 L89.91,278.13 L92.35,283.47 L94.79,305.28 L97.23,307.51 L99.67,286.14 L102.11,239.39 L104.55,238.95 L106.99,236.27 L109.44,262.98 L111.88,273.67 L114.32,275.45 L116.76,299.49 L119.20,300.39 L121.64,303.53 L124.08,296.82 L126.52,262.10 L128.96,240.72 L131.41,230.93 L133.85,250.52 L136.29,242.51 L138.73,225.59 L141.17,256.76 L143.61,232.71 L146.05,197.09 L148.49,178.40 L150.93,165.04 L153.37,141.89 L155.82,163.26 L158.26,73.11 L160.70,70.66 L163.14,100.93 L165.58,123.19 L168.02,120.97 L170.46,135.66 L172.90,124.97 L175.34,105.38 L177.78,119.63 L180.23,119.63 L182.67,119.63 L185.11,87.57 L187.55,73.33 L189.99,64.42 L192.43,64.42 L194.87,83.12 L197.31,92.03 L199.75,85.84 L202.19,109.84 L204.64,128.98 L207.08,123.64 L209.52,140.11 L211.96,111.62 L214.40,155.25 L216.84,126.81 L219.28,127.64 L221.72,149.91 L224.16,108.10 L226.61,108.94 L229.05,106.06 L231.49,95.59 L233.93,117.85 L236.37,86.68 L238.81,72.44 L241.25,78.67 L243.69,74.27 L246.13,98.26 L248.57,118.74 L251.02,140.11 L253.46,122.30 L255.90,122.30 L258.34,84.02 L260.78,87.57 L263.22,82.23 L265.66,75.11 