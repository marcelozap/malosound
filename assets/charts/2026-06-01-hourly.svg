<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">SPY 2026-06-01 hourly line</title><desc id="d">A thin line joins the session open and each hourly bar’s close — eight points across the regular session, positioned by the clock. The last bar covers 15:30 to 16:00 ET. Hourly bars, not a minute path. Gold marks profitable trades and blue losing trades, only between supplied entry and exit times. Color shows the completed trade outcome, not running profit, price direction, or execution quality. Breakeven, unknown outcomes, conflicting overlapping trades, and time outside supplied trades stay neutral. Boundaries clip the displayed line; they do not add price observations. Partial coverage: Webull timed trades; Schwab timing unavailable. Uncoloured time means this record is incomplete there, not that no trading happened.</desc><path d="M24.00,310.00 L170.46,278.93 L316.92,259.78 L463.38,220.86 L609.85,112.26 L756.31,30.00 L902.77,38.82 L976.00,116.66" fill="none" stroke="#81929e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><defs><clipPath id="trade-window-1"><rect x="62.9344" y="0" width="23.7186" height="340"/></clipPath></defs><g clip-path="url(#trade-window-1)"><path d="M24.00,310.00 L170.46,278.93 L316.92,259.78 L463.38,220.86 L609.85,112.26 L756.31,30.00 L902.77,38.82 L976.00,116.66" fill="none" stroke="#e5b657" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><defs><clipPath id="trade-window-3"><rect x="209.2332" y="0" width="19.4875" height="340"/></clipPath></defs><g clip-path="url(#trade-window-3)"><path d="M24.00,310.00 L170.46,278.93 L316.92,259.78 L463.38,220.86 L609.85,112.26 L756.31,30.00 L902.77,38.82 L976.00,116.66" fill="none" stroke="#e5b657" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><defs><clipPath id="trade-window-5"><rect x="262.4882" y="0" width="9.4386" height="340"/></clipPath></defs><g clip-path="url(#trade-window-5